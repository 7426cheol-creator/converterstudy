name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  python:
    name: Python tests, reference check, run-all
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Independent reference check (standard library only)
        run: python verification/independent_reference_check.py --json reference_check.json
      - name: Unit and physics tests
        run: python -m pytest -q
      - name: Run every reference preset (fails on a failed check or a plot without its proved / not-yet paragraph)
        run: python -m convlab run-all --out results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/run_manifest.json
            results/**/*.html
            reference_check.json
          if-no-files-found: ignore

  e2e:
    name: Browser smoke test (every experiment)
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app
        run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: e2e
        run: node smoke.mjs --spawn --screenshots=screens
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e/screens/
          if-no-files-found: ignore

  octave:
    name: Octave independent cross-check (matlab/xc_*.m)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GNU Octave
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - name: Install app
        run: python -m pip install -e .
      - name: Export the presets and run the Octave checks (fails on any FAIL item)
        env:
          PYTHON: python
        run: bash verification/run_octave_crosscheck.sh
      - name: Upload the Octave result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octave-crosscheck
          path: matlab/results/octave_crosscheck.json
          if-no-files-found: warn
